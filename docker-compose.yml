services:
  postgres:
    image: postgres:16-alpine
    container_name: mwc-postgres
    environment:
      POSTGRES_USER: mwc
      POSTGRES_PASSWORD: mwc_dev
      POSTGRES_DB: mwc
    ports:
      - "5433:5432"
    volumes:
      - mwc-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mwc -d mwc"]
      interval: 5s
      timeout: 5s
      retries: 10

  voice-worker:
    build:
      context: .
      dockerfile: apps/voice-worker/Dockerfile
    container_name: mwc-voice-worker
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - ./apps/api/.env
    profiles: ["voice"]   # opt-in — `docker compose --profile voice up` to start

volumes:
  mwc-pgdata:
