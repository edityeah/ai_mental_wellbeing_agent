[project]
name = "mwc-voice-worker"
version = "0.0.0"
description = "Mental Wellbeing Companion — voice agent worker"
requires-python = ">=3.12,<3.13"
dependencies = [
  "livekit-agents>=0.12",
  "livekit-plugins-deepgram>=0.7",
  "livekit-plugins-cartesia>=0.5",
  "livekit-plugins-silero>=0.7",
  "httpx>=0.27",
  "structlog>=24.4",
  "pydantic-settings>=2.6",
  "mwc-api",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
]

[tool.uv.sources]
mwc-api = { path = "../api", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
