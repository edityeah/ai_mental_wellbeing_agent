# Cloudflare Tunnel deployment — runs on your local Mac.
#
# Cloudflare handles TLS at its edge, so we don't need Caddy here.
# Web and API bind to localhost only (127.0.0.1) so they're NOT
# reachable from the local network — only via the tunnel.
#
# Usage:
#   docker compose -f docker-compose.tunnel.yml up -d --build
#
# Secrets come from .env at the repo root.

services:
  # ── Web (Next.js 15) ──────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    ports:
      # Bind to 127.0.0.1 only — cloudflared on the host (or inside
      # docker) reaches it on localhost. Other devices on the LAN
      # cannot reach it directly.
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
    networks:
      - mwc

  # ── API (FastAPI) ─────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PORT: "8000"
      DATABASE_URL: ${DATABASE_URL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_COMPANION_MODEL: ${ANTHROPIC_COMPANION_MODEL}
      ANTHROPIC_HAIKU_MODEL: ${ANTHROPIC_HAIKU_MODEL}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_JWT_AUDIENCE: ${SUPABASE_JWT_AUDIENCE}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL}
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      VOICE_WORKER_SECRET: ${VOICE_WORKER_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DAILY_TEXT_MSG_CAP: ${DAILY_TEXT_MSG_CAP:-50}
      DAILY_VOICE_SECONDS_CAP: ${DAILY_VOICE_SECONDS_CAP:-600}
      PER_CALL_MAX_SECONDS: ${PER_CALL_MAX_SECONDS:-300}
      DAILY_VOICE_MINUTES_GLOBAL: ${DAILY_VOICE_MINUTES_GLOBAL:-500}
      DAILY_COST_CEILING_USD: ${DAILY_COST_CEILING_USD:-20.0}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - mwc

  # ── Voice worker (LiveKit Agents) ─────────────────────────────────
  voice-worker:
    build:
      context: .
      dockerfile: apps/voice-worker/Dockerfile
    restart: unless-stopped
    # No exposed port — only outbound connections to LiveKit Cloud.
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_COMPANION_MODEL: ${ANTHROPIC_COMPANION_MODEL}
      ANTHROPIC_HAIKU_MODEL: ${ANTHROPIC_HAIKU_MODEL}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_JWT_AUDIENCE: ${SUPABASE_JWT_AUDIENCE}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL}
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
      CARTESIA_API_KEY: ${CARTESIA_API_KEY}
      VOICE_WORKER_SECRET: ${VOICE_WORKER_SECRET}
      # Voice worker calls API via docker DNS — no public hop, no TLS
      # overhead, works even when DNS is propagating.
      API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - mwc

networks:
  mwc:
    driver: bridge
